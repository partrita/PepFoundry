[workspace]
name = "pepfoundry"
version = "2.0.0"
description = "RDKit-based peptide construction toolkit supporting natural and non-natural amino acids"
authors = ["Daniel Garzon Otero <vvd9fd@virginia.edu>"]
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "~=3.11.0"
numpy = ">=1.26"
rdkit = "*"
openbabel = "*"
pandas = ">=2.0"
scikit-learn = ">=1.4"
openpyxl = ">=3.1"
ipykernel = "*"

[pypi-dependencies]
pepfoundry = { path = ".", editable = true }

[feature.cpu.pypi-dependencies]
torch = { version = ">=2.0", index = "https://download.pytorch.org/whl/cpu" }
torchvision = { version = ">=0.15", index = "https://download.pytorch.org/whl/cpu" }

[feature.cuda.pypi-dependencies]
torch = { version = ">=2.0", index = "https://download.pytorch.org/whl/cu121" }
torchvision = { version = ">=0.15", index = "https://download.pytorch.org/whl/cu121" }

[environments]
default = ["cuda"]
cpu = ["cpu"]
cuda = ["cuda"]

[tasks]
test-import = "python -c 'import pepfoundry; from pepfoundry.interface import PepFoundry; print(\"PepFoundry loaded successfully!\")'"
